<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Grid</title>
<style>
/* ── Reset & base ── */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter', sans-serif; background:#1b1b17; }
canvas { display:block; position:fixed; top:0; left:0; z-index:0; }

/* ── Hamburger (draggable, snaps to left or right edge) ── */
#hamburger {
  position:fixed; top:18px; right:20px;
  width:38px; height:38px;
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px;
  cursor:grab; z-index:100;
  background:rgba(10,10,8,0.85);
  border:1px solid rgba(255,255,242,0.25);
  border-radius:7px;
  user-select:none; touch-action:none;
  -webkit-user-select:none;
}
#hamburger.snapping {
  transition:left 0.3s cubic-bezier(0.22,1,0.36,1), top 0.3s cubic-bezier(0.22,1,0.36,1);
}
#hamburger.dragging { cursor:grabbing; }
#hamburger:hover { background:rgba(255,255,242,0.12); }
#hamburger span { display:block; width:18px; height:2px; background:rgba(255,255,242,0.75); border-radius:2px; flex-shrink:0; flex-grow:0; }

/* ── Panel ── */
#panel {
  position:fixed; top:64px; right:20px; width:320px;
  background:rgba(10,10,8,0.92);
  border:1px solid rgba(255,255,242,0.14);
  border-radius:10px; padding:0 22px 22px;
  z-index:99;
  opacity:0; pointer-events:none;
  transform:translateY(-8px);
  transition:opacity 0.22s, transform 0.22s;
  max-height:calc(100vh - 80px);
  overflow-y:scroll;
  scrollbar-width:none;
}
#panel.panel-left { right:auto; left:20px; }
#panel::-webkit-scrollbar { display:none; }
#panel.open { opacity:1; pointer-events:all; transform:translateY(0); }

#panel h2 {
  position: sticky;
  top: 0;
  z-index: 2;
  color:rgba(255,255,242,0.7); font-size:11px;
  letter-spacing:.18em; text-transform:uppercase;
  padding: 20px 0 14px;
  margin-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,242,0.07);
  box-shadow: -22px 0 0 0 rgba(10,10,8,0.97), 22px 0 0 0 rgba(10,10,8,0.97);
  background: rgba(10,10,8,0.97);
  display: flex; align-items: center;
}
/* Title text span — hidden during loading so shimmer shows alone */
#panel h2 > span { display:block; flex:1; }
#panel.loading h2 > span { visibility:hidden; }
/* Title shimmer — sized to match the "Grid Settings" label text, not full width */
.sk-h2 {
  display:flex; align-items:center; gap:5px;
}
.sk-h2 .sk-lbl-title {
  width:90px; height:11px; border-radius:3px;
  background:rgba(255,255,242,0.06); overflow:hidden; position:relative; flex-shrink:0;
}
.sk-h2 .sk-lbl-title::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,242,0.22),transparent);
  animation:shimmer 1.4s ease-in-out infinite;
}
#panel.loading .sk-h2 { display:flex; }
#panel:not(.loading) .sk-h2 { display:none; }

/* ── Cascading reveal animation ── */
@keyframes revealRow {
  from { opacity:0; transform:translateY(8px); clip-path:inset(0 100% 0 0); }
  to   { opacity:1; transform:translateY(0);   clip-path:inset(0 0%   0 0); }
}
@keyframes revealFade {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes collapseRow {
  from { opacity:1; transform:translateY(0);   clip-path:inset(0 0%   0 0); }
  to   { opacity:0; transform:translateY(8px); clip-path:inset(0 100% 0 0); }
}
@keyframes collapseFade {
  from { opacity:1; transform:translateY(0); }
  to   { opacity:0; transform:translateY(8px); }
}

/* ── Rows ── */
.row { display:flex; flex-direction:column; margin-bottom:14px; }
.row-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.row-top label { color:rgba(255,255,242,0.55); font-size:11px; letter-spacing:0.06em; white-space:nowrap; }
/* Only target direct value-readout spans, not info-btn spans inside label-group */
.row-top > span {
  color:rgba(255,255,242,0.75); font-size:11px; font-weight:bold; min-width:44px; text-align:right;
}
/* Label group: label text + info icon sit inline together on the left */
.label-group   { display:flex; align-items:center; gap:5px; }

/* ── Slider — thumb on rail + cursors ── */
.row input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 14px;
  background: transparent;
  outline: none;
  border: none;
  cursor: pointer;
  touch-action: pan-y;
  padding: 0;
  margin: 0;
}
/* Track */
.row input[type=range]::-webkit-slider-runnable-track {
  height: 3px;
  background: linear-gradient(to right,
    rgba(255,255,242,0.55) 0%,
    rgba(255,255,242,0.55) var(--pct,0%),
    rgba(255,255,242,0.15) var(--pct,0%),
    rgba(255,255,242,0.15) 100%);
  border-radius: 2px;
}
.row input[type=range]::-moz-range-track {
  height: 3px;
  background: rgba(255,255,242,0.15);
  border-radius: 2px;
}
.row input[type=range]::-moz-range-progress {
  height: 3px;
  background: rgba(255,255,242,0.55);
  border-radius: 2px;
}
/* Thumb */
.row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: rgba(255,255,242,0.80);
  border: none;
  box-shadow: 0 0 0 2px rgba(255,255,242,0.18);
  cursor: grab;
  margin-top: -5px;
}
.row input[type=range]:active::-webkit-slider-thumb {
  cursor: grabbing;
  background: rgba(255,255,242,1.0);
}
.row input[type=range]::-moz-range-thumb {
  width: 13px; height: 13px;
  border-radius: 50%;
  background: rgba(255,255,242,0.80);
  border: none;
  cursor: grab;
}
.row input[type=range]:active::-moz-range-thumb {
  cursor: grabbing;
}

/* ── Skeleton shimmer ── */
@keyframes shimmer {
  0%   { transform:translateX(-100%); }
  100% { transform:translateX(220%); }
}
.sk-bar {
  height:3px; background:rgba(255,255,242,0.06);
  border-radius:2px; overflow:hidden; position:relative;
}
.sk-bar::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,242,0.20),transparent);
  animation:shimmer 1.4s ease-in-out infinite;
}
.sk-lbl {
  height:10px; border-radius:3px;
  background:rgba(255,255,242,0.06); overflow:hidden; position:relative;
}
.sk-lbl::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,242,0.20),transparent);
  animation:shimmer 1.4s ease-in-out infinite;
}
.sk-icon {
  width:14px; height:14px; min-width:14px; border-radius:50%;
  background:rgba(255,255,242,0.06); overflow:hidden; position:relative; flex-shrink:0;
}
.sk-icon::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,242,0.28),transparent);
  animation:shimmer 1.4s ease-in-out infinite;
}
.sk-val {
  height:10px; width:38px; min-width:38px; border-radius:3px; flex-shrink:0;
  background:rgba(255,255,242,0.06); overflow:hidden; position:relative;
}
.sk-val::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,242,0.28),transparent);
  animation:shimmer 1.4s ease-in-out infinite;
}
.sk-left { display:flex; align-items:center; gap:5px; }
.sk-block {
  border-radius:5px; background:rgba(255,255,242,0.06);
  overflow:hidden; position:relative;
}
.sk-block::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,242,0.20),transparent);
  animation:shimmer 1.4s ease-in-out infinite;
}

/* ── Loading state ── */
#panel.loading .row-top > .label-group,
#panel.loading .row-top > span      { display:none; }
#panel.loading .row input[type=range] { display:none; }
#panel.loading .row .clr-inputs     { display:none; }
#panel.loading .toggle-row > .label-group,
#panel.loading .fps-row > .label-group,
#panel.loading .toggle-row > .toggle-wrap { display:none; }
#panel.loading .section-header > .label-group,
#panel.loading .section-header > .chevron-icon { display:none; }
#panel.loading .sk-bar,
#panel.loading .sk-lbl,
#panel.loading .sk-icon,
#panel.loading .sk-val,
#panel.loading .sk-block            { display:block; }
#panel.loading .sk-left             { display:flex; }
#panel:not(.loading) .sk-bar,
#panel:not(.loading) .sk-lbl,
#panel:not(.loading) .sk-icon,
#panel:not(.loading) .sk-val,
#panel:not(.loading) .sk-block,
#panel:not(.loading) .sk-left       { display:none; }
#panel.loading hr                   { opacity:1; background:rgba(255,255,242,0.06); height:1px; border:none; overflow:hidden; position:relative; }
#panel.loading hr::after            { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,242,0.18),transparent); animation:shimmer 1.4s ease-in-out infinite; }
#panel.loading .brow > button       { display:none; }
#panel.loading #dome-sliders.collapsed { max-height:0; opacity:0; padding-top:0; }
#panel.loading #perf-panel.collapsed { max-height:0; opacity:0; padding-top:0; }

/* ── Section headers ── */
.section-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:0; cursor:pointer; user-select:none;
}
.section-header:hover .section-label { color:rgba(255,255,242,0.80); }
.section-label {
  color:rgba(255,255,242,0.55); font-size:10px;
  letter-spacing:.14em; text-transform:uppercase;
  transition:color 0.15s;
}
.chevron-icon {
  display:flex; align-items:center; justify-content:center;
  width:16px; height:16px;
  color:rgba(255,255,242,0.35);
  transition:transform 0.22s ease, color 0.15s;
}
.chevron-icon.open { transform: rotate(180deg); color:rgba(255,255,242,0.60); }
#dome-sliders {
  overflow:hidden;
  transition:max-height 0.28s ease, opacity 0.22s ease;
  max-height:700px; opacity:1;
  padding:4px 0 6px;
}
#dome-sliders.collapsed { max-height:0; opacity:0; pointer-events:none; padding-top:0; }
#dome-sliders .row:last-child { margin-bottom: 0; }

/* ── Color rows ── */
.row .clr-inputs { display:flex; align-items:center; gap:10px; }
.row .clr-preview {
  position:relative; width:36px; height:30px; flex-shrink:0;
  border:1px solid rgba(255,255,242,0.18);
  border-radius:5px; overflow:hidden; cursor:pointer;
  display:block;
}
.row .clr-preview:hover { border-color:rgba(255,255,242,0.35); }
.row .clr-preview-swatch { position:absolute; inset:0; pointer-events:none; }
.row .clr-inputs input[type=text] {
  flex:1; background:rgba(255,255,242,0.05);
  border:1px solid rgba(255,255,242,0.15);
  border-radius:5px; color:rgba(255,255,242,0.8);
  font-family:monospace; font-size:11px;
  height:30px;
  padding:0 10px; outline:none; letter-spacing:0.08em;
  display:block;
}
.row .clr-inputs input[type=text]:focus { border-color:rgba(255,255,242,0.35); }

hr { border:none; border-top:1px solid rgba(255,255,242,0.07); margin:10px 0; }

/* ── Toggle switch ── */
.toggle-row {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}
.toggle-row label {
  color:rgba(255,255,242,0.55); font-size:11px;
  letter-spacing:0.06em; cursor:pointer; user-select:none;
}
.toggle-wrap {
  position:relative; width:36px; height:20px;
  flex-shrink:0; cursor:pointer;
  outline:none;
}
.toggle-track {
  position:absolute; inset:0;
  background:rgba(255,255,242,0.10);
  border:1px solid rgba(255,255,242,0.18);
  border-radius:10px;
  transition:background 0.18s, border-color 0.18s;
}
.toggle-wrap.on .toggle-track {
  background:rgba(255,180,80,0.28);
  border-color:rgba(255,180,80,0.50);
}
.toggle-thumb {
  position:absolute;
  width:13px; height:13px;
  border-radius:50%;
  background:rgba(255,255,242,0.80);
  box-shadow:0 0 0 2px rgba(255,255,242,0.18);
  top:50%; transform:translateY(-50%) translateX(2px);
  transition:transform 0.18s, background 0.18s, box-shadow 0.18s;
  pointer-events:none;
}
.toggle-wrap.on .toggle-thumb {
  transform:translateY(-50%) translateX(21px);
  background:rgba(255,180,80,0.90);
  box-shadow:0 0 0 2px rgba(255,180,80,0.25);
}
.toggle-wrap:focus-visible .toggle-track {
  box-shadow:0 0 0 2px rgba(255,255,242,0.30);
}

/* ── Overlay animations ── */
@keyframes overlayReveal {
  from { opacity:0; clip-path:inset(0 100% 0 0); }
  to   { opacity:1; clip-path:inset(0 0%   0 0); }
}
@keyframes shimmerOnce {
  0%   { transform:translateX(-100%); opacity:1; }
  80%  { transform:translateX(220%);  opacity:1; }
  100% { transform:translateX(220%);  opacity:0; }
}

/* ── Color picker ── */
.cpk {
  position:fixed; z-index:200;
  background:rgba(10,10,8,0.97);
  border:1px solid rgba(255,255,242,0.18);
  border-radius:8px;
  padding:14px;
  width:220px;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);
  display:none;
  flex-direction:column; gap:10px;
  overflow:hidden;
}
.cpk.open {
  display:flex;
  animation: overlayReveal 0.52s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.cpk.open::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,242,0.08),transparent);
  animation:shimmerOnce 0.6s ease-out 0.1s both;
}
.cpk-sl {
  width:100%; height:130px;
  border-radius:5px; cursor:crosshair;
  position:relative; flex-shrink:0;
}
.cpk-hue {
  width:100%; height:12px;
  border-radius:6px; cursor:pointer;
  background:linear-gradient(to right, #f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  position:relative;
}
.cpk-hue-thumb {
  position:absolute; top:50%;
  width:14px; height:14px;
  border-radius:50%;
  border:2px solid rgba(255,255,242,0.9);
  box-shadow:0 0 0 1px rgba(0,0,0,0.4);
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.cpk-inputs { display:flex; gap:5px; }
.cpk-hex {
  flex:2; min-width:0;
  background:rgba(255,255,242,0.05);
  border:1px solid rgba(255,255,242,0.15);
  border-radius:5px; color:rgba(255,255,242,0.85);
  font-family:monospace; font-size:11px;
  padding:5px 7px; outline:none; letter-spacing:0.06em;
}
.cpk-chan {
  flex:1; min-width:0;
  background:rgba(255,255,242,0.05);
  border:1px solid rgba(255,255,242,0.15);
  border-radius:5px; color:rgba(255,255,242,0.85);
  font-family:monospace; font-size:11px;
  padding:5px 4px; outline:none; text-align:center;
  -moz-appearance:textfield;
}
.cpk-chan::-webkit-inner-spin-button,
.cpk-chan::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
.cpk-hex:focus, .cpk-chan:focus { border-color:rgba(255,255,242,0.35); }

/* ── FPS stepper ── */
.fps-row { gap:10px; }
.fps-stepper {
  display:flex; align-items:center; gap:0; flex-shrink:0;
  border:1px solid rgba(255,255,242,0.15); border-radius:6px;
  overflow:hidden;
}
.fps-chevron {
  width:26px; height:28px;
  background:rgba(255,255,242,0.06);
  border:none; color:rgba(255,255,242,0.55);
  font-size:18px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background 0.14s, color 0.14s;
  flex-shrink:0; padding:0;
}
.fps-chevron:hover { background:rgba(255,255,242,0.13); color:rgba(255,255,242,0.90); }
.fps-display {
  display:flex; align-items:baseline; justify-content:center; gap:3px;
  width:64px; height:28px;
  background:rgba(255,255,242,0.04);
  border-left:1px solid rgba(255,255,242,0.10);
  border-right:1px solid rgba(255,255,242,0.10);
}
#fps-val {
  color:rgba(255,180,80,0.90); font-family:monospace;
  font-size:13px; font-weight:bold; line-height:28px;
}
.fps-unit {
  color:rgba(255,255,242,0.35); font-family:monospace;
  font-size:9px; line-height:28px; letter-spacing:0.05em;
}
#panel.loading .fps-stepper { display:none; }

/* ── Collapsible panels ── */
#perf-panel {
  overflow:hidden;
  transition:max-height 0.28s ease, opacity 0.22s ease;
  max-height:300px; opacity:1; padding:4px 0 6px;
}
#perf-panel.collapsed { max-height:0; opacity:0; pointer-events:none; padding-top:0; }
#perf-panel .toggle-row:last-child { margin-bottom:0; }

#presets-panel {
  overflow:hidden; transition:max-height 0.28s ease, opacity 0.22s ease;
  max-height:200px; opacity:1; padding:4px 0 6px;
}
#presets-panel.collapsed { max-height:0; opacity:0; pointer-events:none; padding-top:0; }
#panel.loading #presets-panel.collapsed { max-height:0; opacity:0; padding-top:0; }
.preset-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
.preset-pill {
  height:36px; border:1px solid rgba(255,255,242,0.15);
  border-radius:5px; background:transparent;
  cursor:pointer; padding:0; position:relative; overflow:hidden;
  transition:border-color 0.14s, box-shadow 0.14s;
  display:flex; align-items:center; justify-content:center;
}
.preset-pill:hover { border-color:rgba(255,255,242,0.40); }
.preset-pill-label {
  position:relative; z-index:1;
  font-family:'Inter',sans-serif; font-size:9px; font-weight:700;
  letter-spacing:0.07em; text-transform:uppercase;
  color:rgba(255,255,242,0.90);
  text-shadow:0 1px 3px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.6);
}
.preset-pill.preset-active {
  border-color:rgba(255,180,80,0.80) !important;
  box-shadow:0 0 0 1px rgba(255,180,80,0.50);
}

#appearance-panel {
  overflow:hidden; transition:max-height 0.28s ease, opacity 0.22s ease;
  max-height:600px; opacity:1; padding:4px 0 6px;
}
#appearance-panel.collapsed { max-height:0; opacity:0; pointer-events:none; padding-top:0; }
#panel.loading #appearance-panel.collapsed { max-height:0; opacity:0; padding-top:0; }
#appearance-panel .toggle-row:last-child { margin-bottom:0; }
#appearance-panel .row:last-child { margin-bottom:0; }

#global-panel {
  overflow:hidden; transition:max-height 0.32s ease, opacity 0.25s ease;
  max-height:600px; opacity:1; padding:4px 0 6px;
}
#global-panel.collapsed { max-height:0; opacity:0; pointer-events:none; padding-top:0; }
#panel.loading #global-panel.collapsed { max-height:0; opacity:0; padding-top:0; }
#panel.loading .preset-pill { opacity:0; pointer-events:none; }
#global-panel .toggle-row:last-child { margin-bottom:0; }
#global-panel .row:last-child { margin-bottom:0; }

.section-divider {
  border: none;
  border-top: 1px solid rgba(255,255,242,0.07);
  margin: 2px 12px 12px;
  width: calc(100% - 24px);
}

#expand-all-btn {
  background: none; border: none; cursor: pointer; padding: 4px;
  margin-left: auto; color: rgba(255,255,242,0.35);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border-radius: 4px;
  transition: color 0.15s, background 0.15s;
}
#expand-all-btn:hover {
  color: rgba(255,255,242,0.75);
  background: rgba(255,255,242,0.08);
}
.brow { display:flex; gap:6px; margin-top:4px; position:relative; }
.brow button {
  flex:1;
  background:rgba(255,255,242,0.06);
  border:1px solid rgba(255,255,242,0.15);
  border-radius:5px; color:rgba(255,255,242,0.55);
  font-family:monospace; font-size:10px;
  letter-spacing:.05em; padding:8px 4px; cursor:pointer;
  white-space:nowrap; text-align:center;
  display:flex; align-items:center; justify-content:center; gap:4px;
}
.brow button:hover { background:rgba(255,255,242,0.12); }
.brow button.reset { border-color:rgba(255,180,80,0.3); color:rgba(255,180,80,0.65); }
.brow button.reset:hover { background:rgba(255,180,80,0.08); }

/* ── Tooltip ── */
.info-btn {
  display:inline-flex; align-items:center; justify-content:center;
  width:14px; height:14px; min-width:14px; max-width:14px;
  border-radius:50%;
  border:1px solid rgba(255,255,242,0.28);
  color:rgba(255,255,242,0.45); font-size:9px; font-family:monospace;
  cursor:default; user-select:none; flex-shrink:0;
  transition:border-color 0.15s, color 0.15s;
  text-align:center; line-height:14px;
}
.info-btn:hover { border-color:rgba(255,255,242,0.65); color:rgba(255,255,242,0.85); }
#tooltip {
  position:fixed; z-index:300;
  background:rgba(10,10,8,0.97);
  border:1px solid rgba(255,255,242,0.18);
  border-radius:8px; padding:10px 13px;
  width:210px; pointer-events:none;
  opacity:0;
  font-family:monospace; font-size:10.5px; line-height:1.55; white-space:pre-line;
  color:rgba(255,255,242,0.70);
  box-shadow:0 6px 24px rgba(0,0,0,0.55);
  overflow:hidden;
}
#tooltip.visible {
  opacity:1; pointer-events:auto;
  animation: overlayReveal 0.52s cubic-bezier(0.22, 1, 0.36, 1) both;
}
#tooltip.visible::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,242,0.08),transparent);
  animation:shimmerOnce 0.5s ease-out 0.05s both;
}

/* ── Vignette ── */
#vignette {
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background: radial-gradient(ellipse at center,
    transparent 35%,
    rgba(0,0,0,0.25) 55%,
    rgba(0,0,0,0.65) 75%,
    rgba(0,0,0,0.92) 100%);
  opacity:0; transition:opacity 0.6s;
}
#vignette.on { opacity:1; }
</style>
</head>
